# The RHINO release this repository's gates run, pinned by identity and by the
# digest of every archive the release publishes.
#
# Both halves matter. The digest proves the bytes are the ones that were
# published; the commit proves those bytes were built from the source this pin
# names, so a correctly checksummed archive from some other build still cannot
# stand in. The bootstrap verifies both before it will execute anything.
#
# A correction ships as a new pin, never as an edit to what a published tag
# resolved to.
