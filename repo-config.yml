# Repository configuration — ose/repo-config/v2
#
# What this repository is, and what must pass before a change lands. Nothing
# else: a formatter's settings belong to the formatter, and a dependency list
# belongs to the manifest that already holds one.
#
# `gates` is ordered, and the order is the contract. Gates run in declaration
# order and stop at the first failure, which is why `public-safety` is first on
# every surface it applies to: the cheapest moment to refuse to publish
# something is before anything else has acted on it.

schema: ose/repo-config/v2
visibility: public

# What each harness uses for each portable tier. Deliberately partial, and the
# partiality is the statement: `claude` is the harness whose agent definitions
# express both a model and an effort, so it is the one that can be given a
# complete pin. Codex and OpenCode are omitted rather than mapped to nothing --
# an omitted harness inherits its own default, and a tier mapped to an empty
# value would be a pin this repository never chose wearing the shape of one it
# did.
#
# `plan` is the only tier any canonical agent here declares. Mapping the other
# three would be writing policy for artifacts that do not exist.
model-tiers:
  claude:
    plan:
      model: opus
      effort: high

# Directory names, matched at any depth. RHINO walks the filesystem rather than
# the index, so a git-ignored directory is still read unless it is named here.
scan:
  exclude-directories:
    - .git
    - node_modules
    - worktrees
    - local-tmp

# How the canon reaches each coding harness.
#
# The canonical files under `.agents/` are what a human edits. An adapter is
# generated from them, is never edited in place, and carries the harness's own
# vocabulary rather than a second copy of the rule.
#
# Written in block style throughout, including the translation entries. RHINO's
# own configuration writes these as multi-line flow mappings; the v2 reader
# cannot read that form and loses every top-level key after it.
harness-parity:
  canonical:
    instruction: AGENTS.md
    instruction-adapter: CLAUDE.md
    skills-root: .agents/skills
    skill-route:
      "Read {path} completely, resolve every relative resource from that skill directory, and follow it as authoritative
      before acting."
    agents-root: .agents/agents
    agent-route:
      "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as
      authoritative. If it cannot be read, stop and report the missing path."
    # The field names this catalog's own agents use. `denials` names where a
    # denial would be written; no agent here writes one, because the closed
    # agent metadata schema declares a grant list and nothing else, and what is
    # not granted is not available.
    declaration:
      grants: capabilities
      denials: denies
      limits: constraints
  harnesses:
    # Claude Code reads only `.claude/skills/`, so it is the one harness whose
    # skills need a route. Codex and OpenCode read `.agents/skills/` natively:
    # for them the canon is already the surface, and a wrapper would be a second
    # copy of a file they were going to read anyway.
    - name: claude
      skill-adapter:
        path: ".claude/skills/{name}/SKILL.md"
        format: front-matter
        route-field: body
        identity:
          name: name
          description: description
        # A wrapper declares its identity and the route. Nothing else: an
        # adapter that could add front matter could add an instruction.
        closed: true
      agent-adapter:
        path: ".claude/agents/{name}.md"
        format: front-matter
        route-field: body
        identity:
          name: name
          description: description
        tier-fields:
          model: model
          effort: effort
        translations:
          - when: always
            field: tools
            members:
              - Read
          - when: requires
            capability: repository-read
            field: tools
            members:
              - Glob
              - Grep
          - when: requires
            capability: repository-write
            field: tools
            members:
              - Write
              - Edit
          - when: requires
            capability: shell
            field: tools
            members:
              - Bash
    - name: codex
      agent-adapter:
        path: ".codex/agents/{name}.toml"
        format: toml
        route-field: developer_instructions
        identity:
          name: name
          description: description
        # No `tier-fields`. Codex expresses no per-agent effort, so there is no
        # complete pair to project and the mapping does not reach it.
        absent:
          - model
    - name: opencode
      agent-adapter:
        path: ".opencode/agents/{name}.md"
        format: front-matter
        route-field: body
        identity:
          description: description
        fixed:
          mode: subagent
        translations:
          - when: always
            field: permission
            entries:
              read: allow
          - when: requires
            capability: repository-read
            field: permission
            entries:
              glob: allow
              grep: allow
          - when: requires
            capability: repository-write
            field: permission
            entries:
              edit: allow
          - when: requires
            capability: shell
            field: permission
            entries:
              bash: allow
  prohibited-instruction-sources:
    - "**/AGENTS.md"
    - "**/AGENTS.override.md"
    - "**/CLAUDE.md"
    - ".claude/rules/**/*.md"
    - "**/GEMINI.md"
    - "**/.cursorrules"
    - "**/.windsurfrules"
    - ".github/copilot-instructions.md"
  capabilities:
    - repository-read
    - repository-write
    - shell
    - network
    - subagent
  constraints:
    - read-only

# Which schema each artifact family is held to. Ordered: the last matching glob
# wins, so the workflow subtree carries a different schema from the governance
# tree it sits inside, and an index README carries the schema of an index rather
# than the schema of the thing it indexes.
#
# Written in block style throughout. The v2 reader has no flow support, and a
# flow mapping spanning lines makes it lose every top-level key that follows.
metadata:
  surfaces:
    - glob: "repo-governance/**/*.md"
      schema: governance
    - glob: "repo-governance/workflows/**/*.md"
      schema: workflow
    - glob: ".agents/skills/*/SKILL.md"
      schema: skill
    - glob: ".agents/agents/*.md"
      schema: agent
    - glob: ".agents/**/README.md"
      schema: governance

# 750 words, counted the way the retired shell leaf counted them: anything
# between two runs of whitespace, so `**bold**` is one word and a URL is one
# word. Keeping the rule identical is the point -- this replaces an
# implementation, not a policy, and a budget that moved during the swap would
# make the two incomparable.
governance-word-budget:
  count: whitespace-separated
  surfaces:
    - glob: "AGENTS.md"
      fail: 750
    - glob: "CLAUDE.md"
      fail: 750
    - glob: "repo-governance/**/*.md"
      fail: 750

# The shared plan-structure fixture corpus is excluded as a link *source* only.
# Every case in it is deliberately malformed in exactly one way, and its bytes
# are a boundary two implementations agree on by digest. It stays a valid link
# target.
md-internal-link:
  exclude-sources:
    - "specs/fixtures/**"

gates:
  - id: public-safety
    kind: check
    run:
      - bash
      - scripts/public-safety/check.sh
    surfaces:
      - commit-msg
      - pre-commit
      - pre-push
      - ci

  - id: public-safety-tests
    kind: check
    run:
      - bash
      - scripts/public-safety/tests/run.sh
    surfaces:
      - ci

  - id: markdown-format
    kind: check
    run:
      - npx
      - --no-install
      - prettier
      - --check
      - .
    surfaces:
      - pre-commit
      - ci

  - id: markdown-lint
    kind: check
    run:
      - npx
      - --no-install
      - markdownlint-cli2
    surfaces:
      - pre-commit
      - ci

  # The three rules below moved off this repository's own leaves and onto the
  # pinned RHINO. Each was a faithful implementation of a shared contract, and
  # nine repositories writing nine of those is how the contract drifts apart in
  # the first place. The policy did not move: the schemas, the 750-word budget,
  # its counting rule, and the fixture link exclusion are all declared above, in
  # this repository's own configuration, and RHINO holds none of them.
  - id: artifact-metadata
    kind: check
    run:
      - ./rhino
      - metadata
      - validate
    surfaces:
      - pre-commit
      - ci

  - id: word-budget
    kind: check
    run:
      - ./rhino
      - governance
      - word-budget
      - validate
    surfaces:
      - pre-commit
      - ci

  - id: internal-links
    kind: check
    run:
      - ./rhino
      - md
      - internal-link
      - validate
    surfaces:
      - pre-commit
      - ci
