# yaml-language-server: $schema=https://raw.githubusercontent.com/wahidyankf/rhino/v0.5.0/schemas/repo-config/v2.schema.json
# Portable catalog policy. Product implementation belongs to Rhino; each adopter owns its selected policy values.

schema: rhino/repo-config/v2

repository: {}

scan:
  exclude-directories:
    - .git
    - node_modules
    - worktrees
    - local-tmp

harness:
  canonical:
    agents:
      name: name
      description: description
      tier: tier
      grants: capabilities
      denials: denies
      constraints: constraints
    skills:
      name: name
      description: description
  requirements:
    capabilities:
      - repository-read
      - repository-write
      - shell
      - network
      - subagent
    constraints:
      - read-only
    routes:
      - canonical-import
    identities:
      - description
  profiles:
    - id: claude
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
          - subagent
        constraints:
          - read-only
        routes:
          - canonical-import
        identities:
          - description
      instruction-adapter:
        path: CLAUDE.md
        route: "@{path}"
      agent-adapter:
        path: ".claude/agents/{name}.md"
        format: front-matter
        route-field: body
        route:
          "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it
          as authoritative. If it cannot be read, stop and report the missing path."
        identity:
          name: name
          description: description
        tier-fields:
          model: model
          effort: effort
        translations:
          - when: always
            field: tools
            members:
              - Read
          - when: requires
            capability: repository-read
            field: tools
            members:
              - Glob
              - Grep
          - when: requires
            capability: repository-write
            field: tools
            members:
              - Write
              - Edit
          - when: requires
            capability: shell
            field: tools
            members:
              - Bash
      skill-adapter:
        path: ".claude/skills/{name}/SKILL.md"
        format: front-matter
        route-field: body
        route:
          "Read {path} completely, resolve every relative resource from that skill directory, and follow it as
          authoritative before acting."
        identity:
          name: name
          description: description
      tiers:
        plan:
          model: opus
          effort: high
    - id: codex
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
          - subagent
        constraints:
          - read-only
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: ".codex/agents/{name}.toml"
        format: toml
        route-field: developer_instructions
        route:
          "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it
          as authoritative. If it cannot be read, stop and report the missing path."
        identity:
          name: name
          description: description
        absent:
          - model
          - effort
    - id: opencode
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
          - subagent
        constraints:
          - read-only
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: ".opencode/agents/{name}.md"
        format: front-matter
        route-field: body
        route:
          "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it
          as authoritative. If it cannot be read, stop and report the missing path."
        identity:
          description: description
        fixed:
          mode: subagent
        translations:
          - when: always
            field: permission
            entries:
              read: allow
          - when: requires
            capability: repository-read
            field: permission
            entries:
              glob: allow
              grep: allow
          - when: requires
            capability: repository-write
            field: permission
            entries:
              edit: allow
          - when: requires
            capability: shell
            field: permission
            entries:
              bash: allow

policies:
  markdown:
    metadata:
      surfaces:
        - glob: "repo-governance/**/*.md"
          schema: governance
        - glob: "repo-governance/workflows/**/*.md"
          schema: workflow
        - glob: ".agents/skills/*/SKILL.md"
          schema: skill
        - glob: ".agents/agents/*.md"
          schema: agent
        - glob: ".agents/**/README.md"
          schema: governance
    internal-link:
      exclude-sources:
        - "specs/fixtures/**"
  governance:
    word-budget:
      count: whitespace-separated
      surfaces:
        - glob: "AGENTS.md"
          fail: 750
        - glob: "CLAUDE.md"
          fail: 750
        - glob: "repo-governance/**/*.md"
          fail: 750

gates:
  composition:
    pull-request:
      relation: at-least
  entries:
    - id: public-safety
      type: check
      command:
        executable: bash
        args:
          - literal: scripts/public-safety/check.sh
      run-on:
        pre-commit: {}
        pull-request: {}
        main: {}
    - id: public-safety-message
      type: check
      inputs:
        message:
          kind: commit-message
      command:
        executable: bash
        args:
          - literal: scripts/public-safety/check.sh
        environment:
          PUBLIC_SAFETY_MESSAGE:
            input: message.text
      run-on:
        commit-msg:
          bind:
            message:
              source: hook-message-file
        pull-request:
          bind:
            message:
              source: explicit-range
              range: explicit
    - id: public-safety-range
      type: check
      inputs:
        range:
          kind: commit-range
      command:
        executable: bash
        args:
          - literal: scripts/public-safety/check.sh
        environment:
          PUBLIC_SAFETY_BASE:
            input: range.base
          PUBLIC_SAFETY_HEAD:
            input: range.head
      run-on:
        pre-push:
          bind:
            range:
              source: push-updates
              fallback: refs/remotes/origin/main
        pull-request:
          bind:
            range:
              source: explicit-range
              range: explicit
    - id: public-safety-tests
      type: check
      command:
        executable: bash
        args:
          - literal: scripts/public-safety/tests/run.sh
      run-on:
        pull-request:
          reason: "The scanner regression suite needs the pull-request checkout; local hooks must remain bounded."
        main: {}
    - id: markdown-format
      type: check
      command:
        executable: npx
        args:
          - literal: --no-install
          - literal: prettier
          - literal: --check
          - literal: .
      run-on:
        pre-commit: {}
        pull-request: {}
        main: {}
    - id: markdown-lint
      type: check
      command:
        executable: npx
        args:
          - literal: --no-install
          - literal: markdownlint-cli2
      run-on:
        pre-commit: {}
        pull-request: {}
        main: {}
    - id: artifact-metadata
      type: check
      command:
        executable: ./rhino
        args:
          - literal: metadata
          - literal: validate
      run-on:
        pre-commit: {}
        pull-request: {}
        main: {}
    - id: word-budget
      type: check
      command:
        executable: ./rhino
        args:
          - literal: governance
          - literal: word-budget
          - literal: validate
      run-on:
        pre-commit: {}
        pull-request: {}
        main: {}
    - id: internal-links
      type: check
      command:
        executable: ./rhino
        args:
          - literal: md
          - literal: internal-link
          - literal: validate
      run-on:
        pre-commit: {}
        pull-request: {}
        main: {}
    - id: harness-adapters
      type: check
      command:
        executable: ./rhino
        args:
          - literal: harness
          - literal: adapters
          - literal: validate
      run-on:
        pre-commit: {}
        pull-request: {}
        main: {}
